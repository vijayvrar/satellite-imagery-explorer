<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Satellite Imagery Explorer
    </title>

</head>

<body>

    <h1>
        Satellite Imagery Explorer
    </h1>


    <form method="POST">

        <label>
            Latitude:
        </label>

        <input
            type="text"
            name="latitude"
            placeholder="Enter latitude"
            required
        >

        <br><br>


        <label>
            Longitude:
        </label>

        <input
            type="text"
            name="longitude"
            placeholder="Enter longitude"
            required
        >

        <br><br>


        <button type="submit">
            Find Satellite Image
        </button>

    </form>


    {% if error %}

        <hr>

        <h2>
            Error
        </h2>

        <p>
            {{ error }}
        </p>

    {% endif %}


    {% if result %}

        <hr>

        <h2>
            Satellite Image Generated
        </h2>

        <p>
            Latitude: {{ result.latitude }}
        </p>

        <p>
            Longitude: {{ result.longitude }}
        </p>

        <p>
            Scene: {{ result.granule }}
        </p>

        <p>
            Observation: {{ result.observation }}
        </p>

    {% endif %}


</body>

</html>
