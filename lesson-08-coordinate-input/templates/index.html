<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Satellite Imagery Explorer
    </title>

</head>

<body>

    <h1>
        Satellite Imagery Explorer
    </h1>


    <form method="POST">

        <label>
            Latitude:
        </label>

        <input
            type="text"
            name="latitude"
            placeholder="Enter latitude"
            required
        >

        <br><br>


        <label>
            Longitude:
        </label>

        <input
            type="text"
            name="longitude"
            placeholder="Enter longitude"
            required
        >

        <br><br>


        <button type="submit">
            Submit Coordinates
        </button>

    </form>


    {% if latitude and longitude %}

        <hr>

        <h2>
            Coordinates Received
        </h2>

        <p>
            Latitude: {{ latitude }}
        </p>

        <p>
            Longitude: {{ longitude }}
        </p>

    {% endif %}


</body>

</html>
