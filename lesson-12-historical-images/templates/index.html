<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Historical Satellite Images
    </title>

</head>

<body>

    <h1>
        Historical Sentinel-2 Images
    </h1>


    <form method="POST">

        <label>
            Latitude:
        </label>

        <input
            type="text"
            name="latitude"
            placeholder="13.0827"
            required
        >

        <br><br>


        <label>
            Longitude:
        </label>

        <input
            type="text"
            name="longitude"
            placeholder="80.2707"
            required
        >

        <br><br>


        <button type="submit">
            Generate Historical Images
        </button>

    </form>


    {% if error %}

        <p>
            Error: {{ error }}
        </p>

    {% endif %}


    {% if historical %}

        <h2>
            2018
        </h2>

        <img
            src="{{ url_for(
                'static',
                filename='outputs/sentinel_2018.png'
            ) }}"
            alt="Sentinel-2 2018"
            width="500"
        >


        <h2>
            2026
        </h2>

        <img
            src="{{ url_for(
                'static',
                filename='outputs/sentinel_2026.png'
            ) }}"
            alt="Sentinel-2 2026"
            width="500"
        >

    {% endif %}


</body>

</html>
